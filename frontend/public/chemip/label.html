,414 ppm 에서 졸음 그리고 3,082 ppm 에서 협동장애, 침분비, 힘든호흡, 혼수 그리고 사망을 유발함\n·흡입의 위험은 높은 농도에서 증가함\n·고농도의 기체/증기를 흡입하면 기침과 메스꺼움을 동반한 폐의 자극, 두통과 현기증, 반사작용 저하, 피로, 운동실조증를 동반한 중추신경장애을 일으킬 수 있음\n·케톤 증기는 코, 목, 그리고 점막을 자극함\n·고농도로 노출될 경우 중추신경계, 두통, 현기증, 집중력의 저하, 졸음, 심장과 호흡 장애를 유발할 수 있음\n·일부 케톤은 여러가지 신경질환을 야기하여, 몸의 저림을 유도하고 사지를 약하게 할 수 있음 · skin=·피부 자극을 유발함\n·피부로 흡수되면 유해함\n·이 물질의 피부접촉은 유해할 수 있고, 흡수된 후, 전신에 영향을 초래할 수 있음\n이 물질은 직접적인 접촉 후 또는 시간이 경과된 후에, 경증이지만 유의한 염증을 유발시킬 수 있다는 것을 제시하는 일부 증거가 있음\n·반복 노출은 홍반, 부어오름, 수포 등의 접촉성 피부염을 유발시킬 수 있음\n·이 물질을 베인 상처, 찰과상 또는 자극을 일으킨 피부에 노출시키지 말 것\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우, 유해한 영향과 함께 전신 손상을 유발할 수 있음\n·물질 사용에 앞서, 피부를 검사하고, 모든 외상으로 부터 적절히 보호할 것 · eyeball=·각막의 손상될 수 있음\n·증기는 눈의 자극을 유발할 수 있음\n·접촉은 자극, 눈물, 타는듯한 통증을 유발함\n·이 물질은 일부 사람에게 눈 자극을 일으키고, 점안 24시간 이후 눈 손상을 일으킬 수 있다는 증거가 있음\n·통증과 함께 심한 염증이 나타날 것으로 예상됨\n·각막을 손상시킬 수 있음\n·응급처치가 바로 이루어지지 않으면 시력을 영원히 잃을 수 있음\n·반복 노출은 결막염을 일으킬 수 있음\n·희석되지 않은 사이클로헥사논을 래빗(rabit)눈에 투하하면 자극과 각막의 상처가 나타남 · oral=·구토, 구역질 및 설사로 위장자극을 일으킬 수 있음\n·간 및 신장 손상을 유발할 수 있음\n·중추신경계의 저하, 흥분에 의해 특정화되고, 두통, 어지러움, 졸음 그리고 구역질을 유발할 수 있음\n·진전된 단계에서 허탈, 무의식, 혼수상태, 그리고 호흡의 실패로 사망을 유발할 수 있음\n·삼키면 해로움\n·사고로 섭취한 경우는 유해할 수 있음; 동물 실험 결과 150 g 미만의 섭취는 치명적이거나 개인건강에 매우 심한 손상을 일으킬 수 있음\n·액체를 삼키면 폐로 흡인이 일어나 심각한 영향을 줄 수 있는 화학적 폐렴을 야기할 수 있음 · etc=·자료없음\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 인화성 액체 : 구분3|급성 독성(경구) : 구분4|급성 독성(경피) : 구분4|급성 독성(흡입: 분진/미스트) : 구분4|피부 부식성/피부 자극성 : 구분2|심한 눈 손상성/눈 자극성 : 구분1|피부 과민성 : 구분1(1A/1B)|발암성 : 구분2|특정표적장기 독성(1회 노출) : 구분3(호흡기 자극)|특정표적장기 독성(반복 노출) : 구분2\n  그림문자: GHS02.gif|GHS05.gif|GHS07.gif|GHS08.gif\n  신호어: 위험\n  유해·위험문구: H226 : 인화성 액체 및 증기|H302 : 삼키면 유해함|H312 : 피부와 접촉하면 유해함|H315 : 피부에 자극을 일으킴|H317 : 알레르기성 피부 반응을 일으킬 수 있음|H318 : 눈에 심한 손상을 일으킴|H332 : 흡입하면 유해함|H335 : 호흡기 자극을 일으킬 수 있음|H351 : 암을 일으킬 것으로 의심됨(암을 일으키는 노출 경로를 기재한다. 단, 다른 노출경로에 의해 암을 일으키지 않는다는 결정적인 증거가 있는 경우에 한한다.)|H373 : 장기간 또는 반복노출 되면 장기(영향을 받는 것으로 알려진 모든 장기를 명시한다.)에 손상을 일으킬 수 있음(특정표적장기독성(반복노출)을 일으키는 노출 경로를 기재. 단, 다른 노출경로에 의해 특정표적장기독성(반복노출)을 일으키지 않는다는 결정적인 증거가 있는 경우에 한한다.)\n n  regulation=CWA_311 · detail=Threshold Quantity: 1,000,000 · source=EPA\n  regulation=EPCRA_313 · detail=313 · source=EPA\n  regulation=EU_CLP · detail=Flam. Liq. 3; Repr. 2; Acute Tox. 4 *; STOT RE 1; Skin Irrit. 2; Eye Irrit. 2 | H226; H361d; H332; H372 (hearing organs); H315; H319 · source=ECHA\n\n[ECHA]\n  source=ECHA · data={'rml_id': '100.002.592', 'name': 'Styrene', 'ec_number': '202-851-5', 'molecular_formula': 'C8H8', 'regulatory_processes': [], 'clp_classifications': [{'classificationId': '337091', 'rmlId': '100.002.592', 'indexNumber': '601-026-00-0', 'celexNumber': '32014R0605', 'chemicalName': 'styrene', 'effectiveDate': '01-04-2015', 'displayOrder': 1, 'atpCodeName': 'ATP06', 'eurLexLink': 'https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32014R0605', 'isProminentFlag': True, 'status': 'In application', 'dataSource': 'CLP Annex VI', 'isInheritedFlag': False, 'inheritanceInfo': {'inheritanceOrigin': '', 'parentIndexNumber': '', 'parentChemicalName': ''}}]}\n\n[KISChem 독성/응급]\n  chem_ko=·스티렌모노머 · symptom=·고농도 증기는 어지러움증, 경련, 마취의 유발 시킬 수 있음\n·눈, 코, 호흡기관의 자극; 두통, 권태 (쇠약, 탈진), 어지러움, 혼동, 불쾌함 (분명치 않은 불쾌한 느낌), 졸림, 불안정보행; 혼수상태; 피부염 탈지; 간 손상이 가능; 생식계 영향 · inhale=·호흡 기도 자극에 원인이 됨\n·증상은 기침 및 호흡곤란 포함함\n·중추 신경계 기능저하\n·의학 응급 상황에서 고농도의 노출은 폐(폐부종)에 액체를 증가시킬 수 있음\n·일반적인 취급과정 동안 물질에 의해 생성된 증기 또는 에어로졸(미스트, 증기)의 흡입이 해로울 수 있음\n·보고된 자료에 의하면 이 물질은 사람에 따라 호흡기에 자극을 줄 수 있음\n·자극에 대한 신체 반응은 폐 손상의 원인이 될 수 있음\n·스타이렌을 50 mg을 초과하여 노출시켰을 때, 중추신경계 기능저하가 나타나는 반면 100 ppm으로 노출되었을 경우 두통, 피로, 메스꺼움 및 현기증이 일관되게 나타났음\n·100 ppm에서는 감각신경전도가 5-10 % 감소하였고, 50 ppm에 노출된 후에는 반응시간이 느려진다는 증거가 존재함\n·370 ppm에 노출되었을 때, 불쾌한 주관적인 증상과 신경 손상의 징후가 발생함 \n·고농도의 증기상 물질은 중독성 및 의식불명 또는 사망의 원인이 되는 마취효과를 유발함\n·0.1 %에 노출되었을 때, 갑자기 의식불명을 유발할 수 있으며, 1 %까지 노출되면 1시간 이내 사망할 수 있음\n·30분동안 350 ppm을 흡입한(mouth tube를 통해) 실험참가자들 사이에서 단순한 반응시간은 증가하였고 운동실조는 감소하였음\n·1시간 동안 300 ppm의 농도를 노출시킨 통제 흡입 연구에서(mouth tube를 통해 노출), 안구 추적 능력은 감소하였지만 균형 및 운동실조에는 변화가 관찰되지 않았음 \n·만약 고농도의 증기상 물질에 계속 노출되면 혼수, 의식불명 심지어 소생시키지 않으면 사망에 이를 수 있음\n·폐쇄되거나 환기가 잘 되지 않는 구역에서 이 물질을 많이 사용하면 노출의 증가 및 자극성을 유발함\n·시작하기 전에 기계적 환기에 의한 노출의 조절을 고려해야함 \n·고농도의 증기상 물질을 흡입하였을 경우, 급성영향은 기침, 재채기, 두통, 메스꺼움이 나타날 수 있음 · skin=·증상은 홍반, 가려움 및 고통을 포함함\n·이 물질은 피부를 통하여 흡수될 수 있음\n·이 물질은 직접적인 접촉 후 또는 시간이 경과된 후에, 약간의 염증을 유발시킬 수 있음\n·반복 노출은 홍반, 부종, 수포 등의 접촉 피부염을 유발시킬 수 있음\n·이 물질의 피부접촉은 개인의 건강에 유해할 수 있고, 흡수된 후, 전신에 영향을 초래할 수 있음\n·스타이렌의 피부 흡수는 호흡 기도에 의해 현저하게 흡수보다 적는다는 것을 보여줌\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우, 전신 손상을 유발할 수 있음 · eyeball=·자극, 발적, 통증, 각막 손상을 유발 시킬 수 있음\n·증기는 농축시 뚜렷한 눈 자극 효과를 일으키고, 이는 고농도 증기에 대한 일종의 경고임\n·눈 자극이 일어나면, 이용가능한 제어 방법으로 또는 안전한 곳으로 대피하는 방법으로 노출을 줄이기 위해 노력해야 함\n·이 물질은 일부 사람에게 눈 자극을 일으키고, 점안 24시간 이후 눈손상을 일으킬 수 있다는 증거가 있음\n·통증과 함께 심한 염증이 나타날 것으로 예상됨\n·응급처치가 바로 이루어지지 않으면 시력을 영원히 잃을 수 있음\n·반복 노출은 결막염을 일으킬 수 있음 · oral=·위장의 자극을 유발 시킬 수 있음\n·증상은 메스꺼움, 구토, 설사를 포함할수 있음\n·다량을 섭취하면 중추신경계통의 기능저하를 일으킬 수 있음\n·증상은 무기력, 졸음, 비틀거림을 포함할 수 있음\n·경련, 폐부종의 위험 가능성을 유발할수 있음\n·액체를 삼키면 폐로 흡인이 일어나 심각한 영향을 줄 수 있는 화학적 폐렴을 일으킬 수 있음\n·사고로 섭취한 경우는 건강에 손상을 줄 수 있음\n·스타이렌은 경구 또는 흡인 노출후 체내로 흡수됨\n·금식한 쥐에게 스타이렌 수용액 3.147 mg을 경구투여하여 완전한 흡수가 발생함\n·6 ㎍/mL의 혈액 정점은 곧 도달함\n·쥐에게 스타이렌 방사능 동위원소를 경구투여 하자 신장, 간 , 췌장에서 가장 높은 수치가 발견됨\n·스타이렌은 스타이렌 글라이콜로 변환된 스타이렌 산화물로 변형되기 위해 가정함\n·스타이렌 글라이콜은 각각 만데르산에 또는 안식향산과 히푸르산에 신진 대사함\n·만데르산은 또한 페닐글리옥실산으로 변형됨\n·작은 대사 경로는 글루타티온을 가진 스타이렌 산화물의 접합과 비닐 페놀의 형성을 포함함\n·쥐에게 50 mg/kg 스타이렌 방사성 동위원소를 경구투여 하자, 95 %의 오줌성분이 발견되었고, 1 %는 공기,  72시간동안 배설물에 4 % 있음 · etc=·자료없음\n\n[NIOSH]\n  name=Styrene · cas=100-42-5 · formula=C6H5CH=CH2 · rel=50 ppm (213 mg/m³) · rel_stel=100 ppm (426 mg/m³) · pel=100 ppm / 200 ppm (Ceiling) / 600 ppm (5-min peak in any 3 hrs) · idlh=700 ppm · ppe_respiratory=OV/SA · ppe_eye=Chemical splash goggles · ppe_gloves=Viton, Silver Shield · target_organs=Eyes, CNS, respiratory system, liver, reproductive system · symptoms=Irritation eyes, nose, respiratory system; headache, lassitude; dizziness, confusion; malaise, drowsiness; weakness, unsteady gait; narcosis; defatting dermatitis; possible liver injury; reproductive effects\n\n 간 노출은 혼수, 저체온증 그리고 호흡의 감소를 유발함 \n·혼수로부터 회복은 낮고 초기에 노출된 기니아 피그 10마리 3마리가 노출 4일만에 죽음\n·190 ppm 에서 50일동안 노출한 래빗(rabit)의 6시간 노출은 간과 신장의 퇴행변화에 있어 거의 논증할 수 없는 것으로 보여짐\n·309 ppm 에서 비슷한 노출은 다소 결말 자극을, 1,414 ppm 에서 졸음 그리고 3,082 ppm 에서 협동장애, 침분비, 힘든호흡, 혼수 그리고 사망을 유발함\n·흡입의 위험은 높은 농도에서 증가함\n·고농도의 기체/증기를 흡입하면 기침과 메스꺼움을 동반한 폐의 자극, 두통과 현기증, 반사작용 저하, 피로, 운동실조증를 동반한 중추신경장애을 일으킬 수 있음\n·케톤 증기는 코, 목, 그리고 점막을 자극함\n·고농도로 노출될 경우 중추신경계, 두통, 현기증, 집중력의 저하, 졸음, 심장과 호흡 장애를 유발할 수 있음\n·일부 케톤은 여러가지 신경질환을 야기하여, 몸의 저림을 유도하고 사지를 약하게 할 수 있음 · skin=·피부 자극을 유발함\n·피부로 흡수되면 유해함\n·이 물질의 피부접촉은 유해할 수 있고, 흡수된 후, 전신에 영향을 초래할 수 있음\n이 물질은 직접적인 접촉 후 또는 시간이 경과된 후에, 경증이지만 유의한 염증을 유발시킬 수 있다는 것을 제시하는 일부 증거가 있음\n·반복 노출은 홍반, 부어오름, 수포 등의 접촉성 피부염을 유발시킬 수 있음\n·이 물질을 베인 상처, 찰과상 또는 자극을 일으킨 피부에 노출시키지 말 것\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우, 유해한 영향과 함께 전신 손상을 유발할 수 있음\n·물질 사용에 앞서, 피부를 검사하고, 모든 외상으로 부터 적절히 보호할 것 · eyeball=·각막의 손상될 수 있음\n·증기는 눈의 자극을 유발할 수 있음\n·접촉은 자극, 눈물, 타는듯한 통증을 유발함\n·이 물질은 일부 사람에게 눈 자극을 일으키고, 점안 24시간 이후 눈 손상을 일으킬 수 있다는 증거가 있음\n·통증과 함께 심한 염증이 나타날 것으로 예상됨\n·각막을 손상시킬 수 있음\n·응급처치가 바로 이루어지지 않으면 시력을 영원히 잃을 수 있음\n·반복 노출은 결막염을 일으킬 수 있음\n·희석되지 않은 사이클로헥사논을 래빗(rabit)눈에 투하하면 자극과 각막의 상처가 나타남 · oral=·구토, 구역질 및 설사로 위장자극을 일으킬 수 있음\n·간 및 신장 손상을 유발할 수 있음\n·중추신경계의 저하, 흥분에 의해 특정화되고, 두통, 어지러움, 졸음 그리고 구역질을 유발할 수 있음\n·진전된 단계에서 허탈, 무의식, 혼수상태, 그리고 호흡의 실패로 사망을 유발할 수 있음\n·삼키면 해로움\n·사고로 섭취한 경우는 유해할 수 있음; 동물 실험 결과 150 g 미만의 섭취는 치명적이거나 개인건강에 매우 심한 손상을 일으킬 수 있음\n·액체를 삼키면 폐로 흡인이 일어나 심각한 영향을 줄 수 있는 화학적 폐렴을 야기할 수 있음 · etc=·자료없음\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 인화성 액체 : 구분3|급성 독성(경구) : 구분4|급성 독성(경피) : 구분4|급성 독성(흡입: 분진/미스트) : 구분4|피부 부식성/피부 자극성 : 구분2|심한 눈 손상성/눈 자극성 : 구분1|피부 과민성 : 구분1(1A/1B)|발암성 : 구분2|특정표적장기 독성(1회 노출) : 구분3(호흡기 자극)|특정표적장기 독성(반복 노출) : 구분2\n  그림문자: GHS02.gif|GHS05.gif|GHS07.gif|GHS08.gif\n  신호어: 위험\n  유해·위험문구: H226 : 인화성 액체 및 증기|H302 : 삼키면 유해함|H312 : 피부와 접촉하면 유해함|H315 : 피부에 자극을 일으킴|H317 : 알레르기성 피부 반응을 일으킬 수 있음|H318 : 눈에 심한 손상을 일으킴|H332 : 흡입하면 유해함|H335 : 호흡기 자극을 일으킬 수 있음|H351 : 암을 일으킬 것으로 의심됨(암을 일으키는 노출 경로를 기재한다. 단, 다른 노출경로에 의해 암을 일으 이는 기면, 운동실조증, 혼란, 혼수상태 및 저혈압의 과정임\n·소변 빈도감소, 혈뇨, 고혈당 또는 저혈당 및 간 기능 검사의 증가가 일반적임\n·백혈구 증가, 몸의 저림, 말초신경 손상을 발생하지만, 몇 일 동안 지연될 수 있음\n·호흡기 및 피부 노출은 집중력, 이해력, 기억력, 작업능력과 기분상태에 결손을 유발함\n·점막자극은 코의 염증, 타액분비, 기침, 질식 및 호흡곤란을 유발함 · skin=·피부 화상을 유발함\n·피부로 흡수되면 유해할 수 있음\n·직접적인 피부 접촉 후 화학적 화상을 유발할 수 있음\n·이 물질의 피부접촉은 개인의 건강을 손상시킬 수있고, 흡수된 후, 전신에 영향을 초래할 수 있음\n·이 물질을 베인 상처, 찰과상 또는 자극을 일으킨 피부에 노출시키지 말 것\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우, 유해한 영향과 함께 전신 손상을 유발할 수 있음\n·물질 사용에 앞서, 피부를 검사하고, 모든 외상으로 부터 적절히 보호할 것\n·1,1-다이메틸하이드라진은 개의 피부를 통해서 빠르게 흡수되고 주입 이후 30초에 혈액에서 감지됨\n·피부노출이 홍반을 일으킴 · eyeball=·눈 화상을 일으킴\n·각막의 손상될 수 있음\n·이 물질은 직접적으로 접촉시 눈에 화학적 화상을 일으킬 수 있음\n·증기나 미스트는 극심한 자극을 줄 수 있음\n·이 물질이 눈에 접촉하면 심한 눈 손상을 일으킬 수 있음 · oral=·섭취시 유해함\n·섭취할 경우 소화관에 심한 영구적인 손상을 야기할  수 있음\n·위장 화상을 유발함\n·간손상을 유발할 수 있음\n·사고로 이 물질을 섭취할 경우 독성 증상이 초래될 수 있음; 동물 실험 결과 40 g 미만의 섭취는 치명적이거나 개인건강에 매우 심한 손상을 일으킬 수 있음\n·이 물질은 섭취 후 구강과 위장관안에서 화학적 화상을 일으킬 수 있음\n·1,1-다이메틸하이드라진은 많은 복용량에서 강한 경련 유인제임 (동물실험에서)\n·폐부종과 심혈관허탈은 급성으로 중독된 동물의 사망의 원인이 됨\n·1-2일동안 생존한 동물들은 콩팥 손상을 야기할 수 있음\n·급성노출은 구토, 경련, 다른 신경계효과, 그리고 출혈 및 과혈당증을 발생시킴\n·동물에서, 하이드라진 및 그것의 유도체는 경련, 신경계변화, 근육경련 및 발작, 열, 그리고 다른 증상들을 유발하며 심한 경우에는 호흡정지나 사망을 유발함\n·알칼리성의 부식물을 섭취하면 입 주위 화상, 궤양 및 점막 부기, 과다 침분비, 언어 또는 침삼킴 장애가 관찰됨\n·식도와 위는 타는 듯한 통증을 겪음; 구토와 설사가 바로 동반됨\n·후두개가 부어 호흡장애와 질식이 생길 수 있으며; 쇼크가 일어날 수 있음\n·식도, 위 혹은 위판막의 협착이 곧 혹은 긴 지연(몇 주에서 몇 년)뒤에 발생할 수 있음\n·극심한 노출로 식도 또는 위장에 천공이 생길 수 있으며 가슴 또는 복강으로 전염될 수 있으며 흉격 통증, 복부경직 및 발열이 있음\n·위의 모든 사항이 사망을 유발할 수 있음\n·충분히 고용량에서 신장독성을 일으킬 수 있음(예. 신장에 유독함) · etc=·자료없음\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 인화성 액체 : 구분2|급성 독성(경구) : 구분3|급성 독성(경피) : 구분4|급성 독성(흡입: 증기) : 구분2|피부 부식성/피부 자극성 : 구분1|심한 눈 손상성/눈 자극성 : 구분1|생식세포 변이원성 : 구분2|발암성 : 구분1B|특정표적장기 독성(1회 노출) : 구분3(호흡기 자극)|급성 독성(흡입) : 구분3|만성 수생환경 유해성 : 구분2\n  그림문자: GHS02.gif|GHS05.gif|GHS06.gif|GHS08.gif|GHS09.gif\n  신호어: 위험\n  유해·위험문구: H225 : 고인화성 액체 및 증기|H301 : 삼키면 유독함|H312 : 피부와 접촉하면 유해함|H314 : 피부에 심한 화상과 눈에 손상을 일으킴|H318 : 눈에 심한 손상을 일으킴|H330 : 흡입하면 치명적임|H331 : 흡입하면 유독함|H335 : 호흡기 자극을 일으킬 수 있음|H341 : 유전적인 ene', 'ec_number': '203-102-5', 'molecular_formula': 'C12H10N2', 'regulatory_processes': [], 'clp_classifications': [{'classificationId': '423702', 'rmlId': '100.002.820', 'indexNumber': '611-001-00-6', 'celexNumber': '32008R1272', 'chemicalName': 'azobenzene', 'effectiveDate': '01-12-2010', 'displayOrder': 1, 'atpCodeName': 'CLP00', 'eurLexLink': 'https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32008R1272', 'isProminentFlag': True, 'status': 'In application', 'dataSource': 'CLP Annex VI', 'isInheritedFlag': False, 'inheritanceInfo': {'inheritanceOrigin': '', 'parentIndexNumber': '', 'parentChemicalName': ''}}]}\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 급성 독성(경구) : 구분4|피부 부식성/피부 자극성 : 구분2|심한 눈 손상성/눈 자극성 : 구분2|생식세포 변이원성 : 구분2|발암성 : 구분1B|특정표적장기 독성(1회 노출) : 구분3(호흡기 자극)|특정표적장기 독성(반복 노출) : 구분2|급성 독성(흡입) : 구분4|급성 수생환경 유해성 : 구분1|만성 수생환경 유해성 : 구분1\n  그림문자: GHS07.gif|GHS08.gif|GHS09.gif\n  신호어: 위험\n  유해·위험문구: H302 : 삼키면 유해함|H315 : 피부에 자극을 일으킴|H319 : 눈에 심한 자극을 일으킴|H332 : 흡입하면 유해함|H335 : 호흡기 자극을 일으킬 수 있음|H341 : 유전적인 결함을 일으킬 것으로 의심됨(유전적인 결함을 일으키는 노출 경로를 기재한다. 단, 다른 노출경로에 의해 유전적인 결함을 일으키지 않는다는 결정적인 증거가 있는 경우에 한한다.)|H350 : 암을 일으킬 수 있음(암을 일으키는 노출 경로를 기재한다. 단, 다른 노출경로에 의해 암을 일으키지 않는다는 결정적인 증거가 있는 경우에 한한다.)|H373 : 장기간 또는 반복노출 되면 장기(영향을 받는 것으로 알려진 모든 장기를 명시한다.)에 손상을 일으킬 수 있음(특정표적장기독성(반복노출)을 일으키는 노출 경로를 기재. 단, 다른 노출경로에 의해 특정표적장기독성(반복노출)을 일으키지 않는다는 결정적인 증거가 있는 경우에 한한다.)|H400 : 수생생물에 매우 유독함|H410 : 장기적인 영향에 의해 수생\n  예방: P201 : 사용 전 취급 설명서를 확보하시오.|P202 : 모든 안전 예방조치 문구를 읽고 이해하기 전에는 취급하지 마시오.|P260 : 분진/흄/가스/미스트/증기/스프레이를(을)흡입하지 마시오.|P261 : 분진/흄/가스/미스트/증기/스프레이의 흡입을 피하시오.|P264 : 취급 후에는…을(를)철저히 씻으시오.|P270 : 이 제품을 사용할 때에는 먹거나,마시거나 흡연하지 마시오.|P271 : 옥외 또는 환기가 잘 되는 곳에서만 취급하시오.|P273 : 환경으로 배출하지 마시오.|P280 : 보호장갑/보호의/보안경/안면보호구를(을)착용하시오.\n  대응: P301+P312 : 삼켰다면:불편함을 느끼면 의료기관/의사/…의 진찰을 받으시오.|P302+P352 : 피부에 묻으면:다량의 물/…(으)로 씻으시오.|P304+P340 : 흡입하면:신선한 공기가 있는 곳으로 옮기고 호흡하기 쉬운 자세로 안정을 취하시오.|P305+P351+P338 : 눈에 묻으면:몇 분간 물로 조심해서 씻으시오.가능하면 콘택트렌즈를 제거하시오.계속 씻으시오.|P308+P313 : 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|P312 : 불편함을 느끼면 의료기관/의사/…의 진찰을 받으시오.|P314 : 불편함을 느끼면 의학적인 조치/조언을 받으시오.|P321 : …처치를 하시오.|P330 : 입을 씻어내시오.|P332+P313 : 피부 자극이 나타나면:의학적인 조치/조언을 받으시오.|P337+P313 : 눈에 자극이 지속되면:의학적인 조치/조언을 받으시오.|P362+P364 : 오염된 의류를 벗고 다시 사용 전 세척하시오.|P391 : 누출물을 모으시오\n  눈에 들어갔을 때: 눈에 묻으면:몇 분간 물로 조심해서 씻으시오.가능하면 콘택트렌즈를 제거하시오.계속 씻으시오.|눈에 자극이 지속되면:의학적인 조치/조언을 받으시오.\n  피부에 접촉했을 때: 피부 자극이 나타나면:의학적인 조치/조언을 받으시오.|오염된 의류를 벗으시오.|뜨거운 물질인 경우, 열을 없애기 위해 영향을 받은 부위를 다량의 차가운 물에 담그거나 씻어내시오|오염된 옷과 신발을 제거하고 오염지역을 격리하시오|물질과 접촉시 즉시 20분 이상 흐르는 물에 피부와 눈을 씻어내시오\n  흡입했을 때: 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|과량의 먼지 또는 흄에 노출된 경우 깨끗한 공기로 제거하고 기침이나 다른 증상이 있을 경우 의료 조치를 취하시오.|호흡하지 않는 경우 인공호흡을 실시하시오|호흡이 힘들 경우 산소를 공급하시오\n  먹었을 때: 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|입을 씻어내시오.\n  기타 의사의 주의사항: 폭로시 의료진에게 연락하고 추적조사 등의 특별한 응급조치를 취하시오.|의료인력이 해당물질에 대해 인지하고 보호조치를 취하도록 하시오\n  국내규정: |자료없음\n  적절한 공학적 관리: |공정격리, 국소배기를 사용하거나, 공기수준을 노출기준 이하로 조절하는 다른 공학적 관리를 하시오.||운전시 먼지, 흄 또는 미스트를 발생하는 경우, 공기 오염이 노출기준 이하로 유지되도록 환기하시오||이 물질을 저장하거나 사용하는 설비는 세안설비와 안전 샤워를 설치하시오.\n  호흡기 보호: |노출되는 입자상 물질의 물리화학적 특성에 맞는 산업안전보건공단의 인증을 필한 호흡용 보호구를 착용하시오|입자상 물질의 경우 다음과 같은 호흡기 보호구가 권고됨 - 안면부 여과식 방진마스크 또는 공기 여과식 방진마스크(고효율 미립자 여과재) 또는 전동팬 부착방진 마스크(분진, 미스트, 흄용 여과재)|산소가 부족한 경우(&amp;lt;19.6%), 송기마스크, 혹은 자급식 호흡보호구를 착용하시오\n  눈 보호: |눈에 자극을 일으키거나 기타 건강상의 장해를 일으킬 수 있는 입자상 물질에 대하여 눈을 보호하기 위하여 통기성 보안경을 착용하시오||근로자가 접근이 용이한 위치에 긴급세척시설(샤워식) 및 세안설비를 설치하시오\n  손 보호: |화학물질의 물리적 및 화학적 특성을 고려하여 적절한 재질의 보호장갑을 착용하시오\n  신체 보호: |화학물질의 물리적 및 화학적 특성을 고려하여 적절한 재질의 보호의복을 착용하시오\n  성상: 고체(크리스탈) | ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  색상: 노란색에서 주황색까지 | ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  녹는점/어는점: 68 ℃| ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  초기 끓는점과 끓는점 범위: 293 ℃| ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/ 으로 알려진 모든 장기를 명시한다.)에 손상을 일으킬 수 있음(특정표적장기독성(반복노출)을 일으키는 노출 경로를 기재. 단, 다른 노출경로에 의해 특정표적장기독성(반복노출)을 일으키지 않는다는 결정적인 증거가 있는 경우에 한한다.)|H400 : 수생생물에 매우 유독함|H410 : 장기적인 영향에 의해 수생\n  예방: P201 : 사용 전 취급 설명서를 확보하시오.|P202 : 모든 안전 예방조치 문구를 읽고 이해하기 전에는 취급하지 마시오.|P260 : 분진/흄/가스/미스트/증기/스프레이를(을)흡입하지 마시오.|P261 : 분진/흄/가스/미스트/증기/스프레이의 흡입을 피하시오.|P264 : 취급 후에는…을(를)철저히 씻으시오.|P270 : 이 제품을 사용할 때에는 먹거나,마시거나 흡연하지 마시오.|P271 : 옥외 또는 환기가 잘 되는 곳에서만 취급하시오.|P273 : 환경으로 배출하지 마시오.|P280 : 보호장갑/보호의/보안경/안면보호구를(을)착용하시오.\n  대응: P301+P312 : 삼켰다면:불편함을 느끼면 의료기관/의사/…의 진찰을 받으시오.|P302+P352 : 피부에 묻으면:다량의 물/…(으)로 씻으시오.|P304+P340 : 흡입하면:신선한 공기가 있는 곳으로 옮기고 호흡하기 쉬운 자세로 안정을 취하시오.|P305+P351+P338 : 눈에 묻으면:몇 분간 물로 조심해서 씻으시오.가능하면 콘택트렌즈를 제거하시오.계속 씻으시오.|P308+P313 : 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|P312 : 불편함을 느끼면 의료기관/의사/…의 진찰을 받으시오.|P314 : 불편함을 느끼면 의학적인 조치/조언을 받으시오.|P321 : …처치를 하시오.|P330 : 입을 씻어내시오.|P332+P313 : 피부 자극이 나타나면:의학적인 조치/조언을 받으시오.|P337+P313 : 눈에 자극이 지속되면:의학적인 조치/조언을 받으시오.|P362+P364 : 오염된 의류를 벗고 다시 사용 전 세척하시오.|P391 : 누출물을 모으시오\n  눈에 들어갔을 때: 눈에 묻으면:몇 분간 물로 조심해서 씻으시오.가능하면 콘택트렌즈를 제거하시오.계속 씻으시오.|눈에 자극이 지속되면:의학적인 조치/조언을 받으시오.\n  피부에 접촉했을 때: 피부 자극이 나타나면:의학적인 조치/조언을 받으시오.|오염된 의류를 벗으시오.|뜨거운 물질인 경우, 열을 없애기 위해 영향을 받은 부위를 다량의 차가운 물에 담그거나 씻어내시오|오염된 옷과 신발을 제거하고 오염지역을 격리하시오|물질과 접촉시 즉시 20분 이상 흐르는 물에 피부와 눈을 씻어내시오\n  흡입했을 때: 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|과량의 먼지 또는 흄에 노출된 경우 깨끗한 공기로 제거하고 기침이나 다른 증상이 있을 경우 의료 조치를 취하시오.|호흡하지 않는 경우 인공호흡을 실시하시오|호흡이 힘들 경우 산소를 공급하시오\n  먹었을 때: 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|입을 씻어내시오.\n  기타 의사의 주의사항: 폭로시 의료진에게 연락하고 추적조사 등의 특별한 응급조치를 취하시오.|의료인력이 해당물질에 대해 인지하고 보호조치를 취하도록 하시오\n  국내규정: |자료없음\n  적절한 공학적 관리: |공정격리, 국소배기를 사용하거나, 공기수준을 노출기준 이하로 조절하는 다른 공학적 관리를 하시오.||운전시 먼지, 흄 또는 미스트를 발생하는 경우, 공기 오염이 노출기준 이하로 유지되도록 환기하시오||이 물질을 저장하거나 사용하는 설비는 세안설비와 안전 샤워를 설치하시오.\n  호흡기 보호: |노출되는 입자상 물질의 물리화학적 특성에 맞는 산업안전보건공단의 인증을 필한 호흡용 보호구를 착용하시오|입자상 물질의 경우 다음과 같은 호흡기 보호구가 권고됨 - 안면부 여과식 방진마스크 또는 공기 여과식 방진마스크(고효율 미립자 여과재) 또는 전동팬 부착방진 마스크(분진, 미스트, 흄용 여과재)|산소가 부족한 경우(&amp;lt;19.6%), 송기마스크, 혹은 자급식 호흡보호구를 착용하시오\n  눈 보호: |눈에 자극을 되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|P312 : 불편함을 느끼면 의료기관/의사/…의 진찰을 받으시오.|P314 : 불편함을 느끼면 의학적인 조치/조언을 받으시오.|P321 : …처치를 하시오.|P330 : 입을 씻어내시오.|P332+P313 : 피부 자극이 나타나면:의학적인 조치/조언을 받으시오.|P337+P313 : 눈에 자극이 지속되면:의학적인 조치/조언을 받으시오.|P362+P364 : 오염된 의류를 벗고 다시 사용 전 세척하시오.|P391 : 누출물을 모으시오\n  눈에 들어갔을 때: 눈에 묻으면:몇 분간 물로 조심해서 씻으시오.가능하면 콘택트렌즈를 제거하시오.계속 씻으시오.|눈에 자극이 지속되면:의학적인 조치/조언을 받으시오.\n  피부에 접촉했을 때: 피부 자극이 나타나면:의학적인 조치/조언을 받으시오.|오염된 의류를 벗으시오.|뜨거운 물질인 경우, 열을 없애기 위해 영향을 받은 부위를 다량의 차가운 물에 담그거나 씻어내시오|오염된 옷과 신발을 제거하고 오염지역을 격리하시오|물질과 접촉시 즉시 20분 이상 흐르는 물에 피부와 눈을 씻어내시오\n  흡입했을 때: 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|과량의 먼지 또는 흄에 노출된 경우 깨끗한 공기로 제거하고 기침이나 다른 증상이 있을 경우 의료 조치를 취하시오.|호흡하지 않는 경우 인공호흡을 실시하시오|호흡이 힘들 경우 산소를 공급하시오\n  먹었을 때: 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|입을 씻어내시오.\n  기타 의사의 주의사항: 폭로시 의료진에게 연락하고 추적조사 등의 특별한 응급조치를 취하시오.|의료인력이 해당물질에 대해 인지하고 보호조치를 취하도록 하시오\n  국내규정: |자료없음\n  적절한 공학적 관리: |공정격리, 국소배기를 사용하거나, 공기수준을 노출기준 이하로 조절하는 다른 공학적 관리를 하시오.||운전시 먼지, 흄 또는 미스트를 발생하는 경우, 공기 오염이 노출기준 이하로 유지되도록 환기하시오||이 물질을 저장하거나 사용하는 설비는 세안설비와 안전 샤워를 설치하시오.\n  호흡기 보호: |노출되는 입자상 물질의 물리화학적 특성에 맞는 산업안전보건공단의 인증을 필한 호흡용 보호구를 착용하시오|입자상 물질의 경우 다음과 같은 호흡기 보호구가 권고됨 - 안면부 여과식 방진마스크 또는 공기 여과식 방진마스크(고효율 미립자 여과재) 또는 전동팬 부착방진 마스크(분진, 미스트, 흄용 여과재)|산소가 부족한 경우(&amp;lt;19.6%), 송기마스크, 혹은 자급식 호흡보호구를 착용하시오\n  눈 보호: |눈에 자극을 일으키거나 기타 건강상의 장해를 일으킬 수 있는 입자상 물질에 대하여 눈을 보호하기 위하여 통기성 보안경을 착용하시오||근로자가 접근이 용이한 위치에 긴급세척시설(샤워식) 및 세안설비를 설치하시오\n  손 보호: |화학물질의 물리적 및 화학적 특성을 고려하여 적절한 재질의 보호장갑을 착용하시오\n  신체 보호: |화학물질의 물리적 및 화학적 특성을 고려하여 적절한 재질의 보호의복을 착용하시오\n  성상: 고체(크리스탈) | ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  색상: 노란색에서 주황색까지 | ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  녹는점/어는점: 68 ℃| ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  초기 끓는점과 끓는점 범위: 293 ℃| ※출처 : National Library of Medicin 자극을 주며, 천식과 같은 증상의 원인이 됨\n·특히 증발된 부식제의 흡입에 따라 천명, 호흡곤란, 상기도 손상, 폐수종이 발생할 수 있음\n·과도하게 노출되었을 경우 눈물, 유연증(타액분비), 졸음증, 마비, 호흡저하, 호흡곤란, 두통, 허약, 떨림, 마비, 폐부종을 야기할 수 있음\n·이 물질은 EC Directives이나 다른 분류체계에서 '흡입하면 해로운 물질'로 분류 되지 않음. 이는 동물실험 이나 임상실험에 대한 자료가 부족하기 때문임 \n·증거는 충분하지 않지만, 작업 장에서 증기, 흄 및 에어로졸의 통제가 이루어진다고 하더라도 물질에 대한 주의가 이루어져야만 함 · skin=·이 물질은 일부사람에게 있어, 피부 접촉 즉시 피부염을 유발시킬 수 있음\n·모든 유기 과산화물은 피부에 자극을 주며 피부에 남았을 경우, 염증을 유발할 수 있음; 일부는 알레르기를 발생시킴\n·피부접촉은 지속적으로 접촉 했을 때, 화학적 화상을 일으키면서, 급격한 건조, 표백을 유발할 것임\n·피부 접촉은 유해한 건강 영향을 유발시키지 않는 것으로 간주함(동물 모델을 이용한 EC Directives 분류 기준으로서); 이 물질은 상처, 외상, 찰과상을 입은 부분을 통해 침투되면 건강 손상을 유발시킬 수 있음\n·이 물질을 베인 상처, 찰과상 또는 자극을 일으킨 피부에 노출시키지 말 것\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우,유해한 영향과 함께 전신 손상을 유발할 수 있음\n·물질 사용에 앞서, 피부를 검사하고, 모든 외상으로 부터 적절히 보호할 것 · eyeball=·이 물질은 자극제로 고려되지는 않지만 (EC Directives에 의해 분류된 바에 의하면), 직접적 눈 접촉은 눈물이나 결막충혈(바람에 의한 피부염처럼)과 같은 일시적 불쾌감을 일으킬 수 있음\n·경미한 손상 또한 있을 수 있음\n·이 물질은 특정인에게 외부인체자극을 일으킬 수 있음\n·토끼의 눈에 테르페닐(terphenyl) 주입시 심한 결막 자극을 일으킴 · oral=·가성 섭취 후에 식도의 화상과 위장 손실이 일반적으로 일어날 수 있음; 구강점막손상에 의한 결핍은 확실하게 식도화상을 차단함\n·천명, 유연 또는 구토증상의 환자는 식도화상을 입었을 가능성이 큼\n·유기 과산화물을 섭취하면 메스꺼움, 구토, 복부 통증, 마비, 청색증, 점막에 영향을 미칠 수 있음\n·심장에 염증이 발생할 수 있음\n·동물이나 인체 증거가 부족하기 때문에, EC Directive 또는 다른 분류시스템에 \"섭취시 유해함\"으로 분류되어 있지 않음\n·여전히 이 물질의 섭취로 인하여 개인 건강에 손상을 일으킬 수는 있음, 특히, (간, 신장) 일정 기관에 손상이 있는 곳에는 그 증거가 명백함\n·위장의 불편은 메스꺼움과 구토를 일으킬 수 있으나, 작업 환경내에서는, 소량 섭취는 걱정할 정도는 아님 · etc=·자료없음\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 유기과산화물 : 형식F|급성 독성(흡입: 증기) : 구분3|피부 부식성/피부 자극성 : 구분2|심한 눈 손상성/눈 자극성 : 구분2|급성 수생환경 유해성 : 구분1\n  그림문자: GHS02.gif|GHS06.gif|GHS09.gif\n  신호어: 위험\n  유해·위험문구: H242 : 가열하면 화재를 일으킬 수 있음|H315 : 피부에 자극을 일으킴|H319 : 눈에 심한 자극을 일으킴|H331 : 흡입하면 유독함|H400 : 수생생물에 매우 유독함\n  예방: P210 : 열,고온의 표면,스파크,화염 및 그 밖의 점화원으로부터 멀리하시오.금연|P234 : 원래의 용기에만 보관하시오.|P235 : 저온으로 유지하시오.|P240 : 용기와 수용설비를 접지하시오.|P261 : 분진/흄/가스/미스트/증기/스프레이의 흡입을 피하시오.|P264 : 취급 후에는…을(를)철저히 씻으시오.|P271 : 옥외 또는 환기가 잘 되는 곳에서만 취급하시오.|P273 : 환경으로 배출하지 마시오.|P280 : 보호장갑/보호의/보안경/안면보호구를(을)착용하시오.\n  대응: P302+P352 : 피부에 묻으면:다  유발\n·섭취시 유해함 · inhale=·상기도에 기침, 화상, 호흡곤란, 혼수상태를 동반한 심각한 자극을 유발함\n·섭취에서 기술된 것과 유사한 증상이 나타날 수 있음\n·일반적인 취급 과정에서 발생하는 에어로졸(미스트, 흄)을 흡입할 경우 개인의 건강에 심각한 손상을 가져올 수 있음\n·폐를 통해 페놀이 흡수될 경우, 심장혈관과 신경계통에 영향을 미치는 전신영향이 발생할 수 있음\n·흡입하면 심각한 발한, 심한 갈증, 메스꺼움, 구토, 설사, 청색증, 초조함, 마비, 혈압저하, 과호흡, 복통, 빈혈, 경련, 혼수상태, 폐부종, 폐염증을 유발함\n·다음으로 호흡부전과 신장손상이 뒤따름\n·페놀 또한 높은 농도에서 감각의 손실과 일반적인 우울을 유발함\n·페놀 유도체의 독성은 다양함\n·액체상 미스트을 흡입할 경우 매우 유해하고, 경련, 심각한 후두와 기관지의 자극, 화학적 폐렴과 폐부종으로 인해 사망할 수 있음 · skin=·심각한 피부자극 및 화상을 유발함\n·피부로 흡수되면 유해할 수 있음\n·이 물질의 피부접촉은 유해할 수 있고, 흡수된 후, 전신에 영향을 초래할 수 있음\n·이 물질은 피부에 직접 접촉하면, 화학적 화상을 유발시킬 수 있음\n·페놀 및 그 유도체들의 접촉이 계속되면 심각한 피부 자극성을 유발할 수 있으며, 피부로 흡수되어 심혈관과 중추신경계에 영향을 미칠수 있음\n·증상은 발한, 심한 갈증,  메스꺼움 및 구토, 설사, 청색증, 홍반, 마비, 혈압저하, 과호흡, 복통, 빈혈, 경련, 혼수상태, 폐가 붓는것에 이어 폐렴을 포함함\n·호흡부전과 신장손상이 뒤따름\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우, 유해한 영향과 함께 전신 손상을 유발할 수 있음\n·물질 사용에 앞서, 피부를 검사하고, 모든 외상으로 부터 적절히 보호할 것 · eyeball=·눈의 화상을 유발함\n·각막의 손상될 수 있음\n·결막염과 각막염을 유발할 수 있음\n·이 물질은 직접적으로 접촉시 눈에 화학적 화상을 일으킬 수 있음\n·증기나 미스트는 극심한 자극을 줄 수 있음\n·이 물질이 눈에 접촉하면 심한 눈 손상을 일으킬 수 있음\n·일부 페놀(phenol) 유도체는 충혈, 통증 및 흐릿한 시야 증상을 수반하는 가벼운 자극에서 심한 눈 자극까지를 일으킬 수 있음\n·영구적인 눈 손상이 일어날 수 있음; 회복은 불완전할 수 있음 · oral=·극심한 위장 자극, 구역질, 구토 및 화상을 야기할  수 있음\n·간 및 신장 손상을 유발할 수 있음\n·삼키면 해로울 수 있음\n·중추신경계의 저하, 경련, 혼수상태를 유발하고 기도의 마비 때문에 사망을 유발할 수 있음\n·사고로 섭취한 경우는 유해할 수 있음; 동물 실험 결과 150 g 미만의 섭취는 치명적이거나 개인건강에 매우 심한 손상을 일으킬 수 있음\n·물질은 구강과 위장관에 화학적 화상을 유발할 수 있음\n·일부 페놀 치환체는 소화계통에 손상을 야기할 수 있음\n·흡수 시, 과다 땀분비, 갈증, 구역질, 구토, 설사, 청색증, 안절부절증, 혼미, 저혈압, 헐떡임, 복통, 빈혈, 경련, 혼수 및 폐 부종이 생길 수 있으며 폐렴이 관찰될 수 있음\n·호흡저하, 신장손상이 생길 수 있으며 화학적 화상, 발작 및 불규칙한 심장박동이 생길 수 있음 · etc=·자료없음\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 급성 독성(경구) : 구분3|급성 독성(경피) : 구분3|피부 부식성/피부 자극성 : 구분1\n  그림문자: GHS05.gif|GHS06.gif\n  신호어: 위험\n  유해·위험문구: H301 : 삼키면 유독함|H311 : 피부와 접촉하면 유독함|H314 : 피부에 심한 화상과 눈에 손상을 일으킴\n  예방: P260 : 분진/흄/가스/미스트/증기/스프레이를(을)흡입하지 마시오.|P264 : 취급 후에는…을(를)철저히 씻으시오.|P270 : 이 제품을 사용할 때에는 먹거나,마시거나 흡연하지 마시오.|P280 : 보호장갑/보호의/보안경/안면보호구를(을)착용하시오.\n  대응: P301+P310 : 삼켰다면:즉시 의료기관/의사/…의 진찰을 받 inhale=·과민성이 있는 사람에게 기관지 경련이 유발될 수 있음\n·일반적인 취급과정에서 발생하는 분진을 흡입할 경우 유해할 수 있음\n·이 물질은 흡입을 통해 호흡기도 자극이나 건강 손상을 일으킨다고 여겨지지 않음(동물 모델을 이용한 EC Directives 분류 기준으로서)\n·그럼에도 불구하고, 장기간 동안 분진 또는 흄 상태의 물질을 흡입할 경우 호흡곤란을 유발하고 가끔 고통스러울 수 있음\n·호흡기능 장애, 기도 질병, 폐기종 또는 만성기관지염 같은 증상이 있는 사람일 경우, 많은 양의 분진을 흡입하면 증상이 더 악화될 수 있음\n·폐를 통해 페놀이 흡수될 경우, 심장혈관과 신경계통에 영향을 미치는 전신영향이 발생할 수 있음 · skin=·접촉성 피부염이 흔히 일어남\n·이 물질의 피부접촉은 유해할 수 있고, 흡수된 후, 전신에 영향을 초래할 수 있음\n·이 물질은 피부 자극물질로 간주하지 않음(동물 모델을 이용한 EC Directives 분류 기준으로서)\n·지속적인 노출에 의해 찰과상이 발생할 수 있음\n·양호한 작업 위생 실천을 위해서, 작업환경에서 노출을 최소화시키고 적절한 보호 장갑을 착용하도록 요구됨\n·이 물질을 베인 상처, 찰과상 또는 자극을 일으킨 피부에 노출시키지 말 것\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우, 유해한 영향과 함께 전신 손상을 유발할 수 있음\n·물질 사용에 앞서, 피부를 검사하고, 모든 외상으로부터 적절히 보호할 것\n·이 물질은 피부를 통하여 흡수될 수 있음\n·2,4-다이아미노톨루엔 및 그 동질체(congener)들은 약하게 과민성을 유발할 수 있음\n·이전에 2,4-이성질체와 Freund's 보조제에 유도 되었던 기니아 피그에게서 지연된 접촉 과민성이 나타남 · eyeball=·뚜렷한 후두 및 안면부종이 일어날 수 있음\n·후두부종에 의해 호흡부전이 일어날 수 있음\n·PPD가 함유된 염색제, 눈썹, 속눈썹 사용시 과민반응이 즉시 또는 지연되어 나타남\n·눈의 통증 및 화상, 얼굴까지 퍼지는 부종, 피부염, 눈물분비, 눈부심, 포도막염 및 각막염을 일으킬 수 있음\n·각막괴사 및 시력 감퇴가 일어날 수 있음\n·양쪽눈의 시신경염과 실명이 보고된 바 있음\n·이 물질은 일부 사람에게 눈 자극 및 손상을 일으킬 수 있다고 보고된 바 있음 · oral=·섭취 후 상복부 통증과 반복되는 구토가 일반적임\n·돌발적인 물질의 섭취로 인해 독성 증상이 초래될 수 있음; 동물 실험 결과 40 g 미만의 섭취는 치명적이거나 개인건강에 매우 심한 손상을 일으킬 수 있음\n·물질 또는 그것의 대사산물은 해모글로빈에서 정상적인 산소흡수를 방해하는 것을 일으킬 수 있음\n·메트헤모글로빈혈증이라 알려진 이런 상태는 산소 결핍형태임(무산소증) \n·증상은 청색증(피부와 점막의 푸르스름한 탈색)을 포함하며 숨쉬기 어려움\n·청색증(푸른빛 피부 얼룩과 점막)과 호흡 곤란의 증상이 일어날 수 있으며, 노출 몇시간 후까지 징후가 분명하지 않을수 있음. 약 15 % 농도의 헤모글로빈에서, 입술, 코 및 귓볼 청색증을 관찰할 수 있음. 다행증, 얼굴 홍조와 두통이 흔히 나타나지만, 증상은 없을수도 있음. 25-40 %에서, 청색증이 관찰되지만, 장애는 물리적 활동으로 야기된 것보다 거의 나타나지 않음. 40-60 %에서, 허약, 설사, 어지러움, 점점 심한 두통, 운동실조, 빠르고 얕은 호흡, 졸음, 구역질, 구토, 정신착란, 혼수와 마비 증상이 나타남. 60 %이상에서는 호흡곤란, 호흡 기능저하, 심박 급속증이나 서맥, 경련같은 증상이 나타남. 70 % 이상이면 치명적일 수 있음\n·랫드(rat)와 마우스(mice)에 있어 2,4-다이아미노톨루엔의 급성 독성 복용량은 호흡의 비율증가, 혼수상태, 눈꺼풀처짐증을 일으킬 수 있음 · etc=·자료없음\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 급성 독성(경구) : 구분3|급성 독성(경피) : 구분3|심한 눈 손상성/눈 자극성 : 구분2|피부 과민성 : 구분1(1A/1B)|발암성 : 구분1B|생식독성 : 구분2|급성 수 자극하고 결막의 염증, 삼키는 것이 어려워지고, 인두의 홍반을 추가로 유발함\n·다른 증상은 구토, 메스꺼움, 복통, 열, 두통, 현기증, 떨림, 미동, 경련, 말초신경 염증을 포함할 수 있음 \n·고농도로 급성 흡입 시 기관지의 갑작스런 경련, 폐가 붓는 것에 이은 호흡 곤란, 결막과 혀에 염증을 유발할 수 있음 \n·호흡 마비가 생길 수 있음 \n·이산화황으로 인한 호흡기 손상은 장기간 지속될 수 있고 치료가 불가능할 수 있음 \n·주기적인 노출은 후각을 약하게 만들 수 있음 · skin=·액화된 이산화황과 직접 접촉 시 동상을 유발할 수 있음 \n·이 물질이 직접 피부에 접촉되면 화학적 화상을 일으킬 수 있음\n·피부 접촉은 유해한 건강 영향을 유발시키지 않는 것으로 간주함(동물 모델을 이용한 EC Directives 분류 기준으로서)\n·그러나, 전신적인 유해 영향은 적어도 어느 하나의 다른  경로를 통해, 동물에 노출된 후, 확인되어졌고, 그 물질이 상처, 외상, 찰과상을 통해 침투됨에 따라, 건강손상을 유발시킬 수 있음\n·양호한 작업 위생을 위해, 작업환경에서 노출을 최소화시키고, 적절한 관리 조치들을 실행하는 것이 요구됨 \n·증발된 액체는 빠르게 냉각되어 장갑을 꼈을지라도 접촉 시 냉동화상, 동상을 일으킬 수 있음\n·언 피부 조직은 통증이 없으며 왁스 같은 느낌에 노란색을 나타냄\n·동상의 징후와 증상은 저림, 창백에 이어 감각 없어짐, 피부의 경화와 딱딱함, 감연된 부위의 색 변화의 진행(처음에는 흰색, 다음은 얼룩덜룩한 푸른색, 마지막은 검은색; 회복시에는 붉은색, 열기, 통증, 수포가 나타남) 등이 있음\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우, 유해한 영향과 함께 전신 손상을 유발할 수 있음\n·물질 사용에 앞서, 피부를 검사하고, 모든 외상으로 부터 적절히 보호할 것 · eyeball=·피부를 살필 것 \n·이 물질이 직접 눈에 접촉되면 화학적 화상을 일으킬 수 있음\n·증기나 미스트는 극심한 자극을 줄 수 있음\n·이 물질이 눈에 접촉하면 심한 눈 손상을 일으킬 수 있음\n·증발된 액체는 빠르게 냉각되어 장갑을 꼈을지라도 접촉 시 냉동화상, 동상을 일으킬 수 있음\n·언 피부 조직은 통증이 없으며 왁스 같은 느낌에 노란색을 나타냄\n·동상의 징후와 증상은 저림, 창백에 이어 감각 없어짐, 피부의 경화와 딱딱함, 감연된 부위의 색 변화의 진행(처음에는 흰색, 다음은 얼룩덜룩한 푸른색, 마지막은 검은색; 회복시에는 붉은색, 열기, 통증, 수포가 나타남) 등이 있음 · oral=·메스꺼움, 구토, 복통이 보고됨 \n·물질의 물리적 형태로 인해 보통 위험하지 않음 \n·상업/사업장 환경에서 섭취경로가 예상되지 않음 · etc=·자료없음\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 고압가스 : 액화가스|급성 독성(흡입: 가스) : 구분3|피부 부식성/피부 자극성 : 구분1|심한 눈 손상성/눈 자극성 : 구분1\n  그림문자: GHS03.gif|GHS05.gif|GHS06.gif\n  신호어: 위험\n  유해·위험문구: H280 : 고압가스:가열하면 폭발할 수 있음|H314 : 피부에 심한 화상과 눈에 손상을 일으킴|H318 : 눈에 심한 손상을 일으킴|H331 : 흡입하면 유독함\n  예방: P260 : 분진/흄/가스/미스트/증기/스프레이를(을)흡입하지 마시오.|P261 : 분진/흄/가스/미스트/증기/스프레이의 흡입을 피하시오.|P264 : 취급 후에는…을(를)철저히 씻으시오.|P271 : 옥외 또는 환기가 잘 되는 곳에서만 취급하시오.|P280 : 보호장갑/보호의/보안경/안면보호구를(을)착용하시오.\n  대응: P301+P330+P331 : 삼켰다면:입을 씻어내시오.토하게 하지 마시오.|P303+P361+P353 : 피부(또는 머리카락)에 묻으면:오염된 모든 의류를 즉시 벗으시오.피부를 물로 씻으시오[또는 샤워하시오].|P304+P340 : 흡입하면:신선한 공기가 있는 곳으로 옮기고 호흡하기 쉬운 자세로 안정을 취하시오.|P305+P351+P338 : 눈에 묻으면  1 | H331; H370(respiratory system, inhalation); H314 · source=ECHA\n\n[ECHA]\n  source=ECHA · data={'rml_id': '100.028.359', 'name': 'Sulphur dioxide', 'ec_number': '231-195-2', 'molecular_formula': 'O2S', 'regulatory_processes': [], 'clp_classifications': [{'classificationId': '188508', 'rmlId': '100.028.359', 'indexNumber': '016-011-00-9', 'celexNumber': '32024R0197', 'chemicalName': 'sulphur dioxide; sulfur dioxide', 'effectiveDate': '01-09-2025', 'displayOrder': 1, 'atpCodeName': 'ATP21', 'eurLexLink': 'https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R0197', 'isProminentFlag': True, 'status': 'In application', 'dataSource': 'CLP Annex VI', 'isInheritedFlag': False, 'inheritanceInfo': {'inheritanceOrigin': '', 'parentIndexNumber': '', 'parentChemicalName': ''}}]}\n\n[KISChem 독성/응급]\n  chem_ko=·이산화황 · symptom=·소량의 짧은 노출 후에 사망이나 영구적 손상을 유발할 수 있음 \n·1,000 ppm에도 호흡기 손상으로 인해 10분에서 몇 시간 내에 사망에 일으킬 수 있음 \n·눈과 호흡기에 자극적임\n·천식, 정상 이하의 폐 기능, 심혈관계 질병을 가진 사람들은 더 큰 위험에 처함 \n·눈과 피부, 목에 자극적임; 비루; 질식, 기침; 기관지 수축 반사 반응; 액상 : 동상 · inhale=·증기는 매우 자극적이며, 부식성을 띰\n·일반적인 취급과정에서 발생하는 증기와 에어로졸(미스트, 흄)을 흡입할 경우 독성 영향을 일으켜 치명적일 수 있음\n·증기상 흡입 시 유해하고 치명적일 수 있음 \n·폐쇄되거나 환기가 잘 되지 않는 구역에서 이 물질을 많이 사용하면 노출의 증가 및 자극성을 유발함\n·시작하기 전에 기계적 환기에 의한 노출의 조절을 고려해야함 \n·이 물질은 휘발성이 강하고, 폐쇄되거나 환기가 이루어지지 않은 곳에서 농축된 대기를 빠르게 형성할 수 있음 \n·증기상 물질은 공기보다 무겁고 간단한 질식을 유발하며 호흡영역에서 옮겨지거나 공기와 교체될 수 있음\n·과다 노출에 대한 미비한 경고는 이와 같은 사고를 발생시킬 수 있음\n·이산화황은 자극적임\n·단기간 노출은 기관지 수축을 유발함 \n·중독 증상은 인후 자극, 기침, 흉부 압박, 호흡곤란, 눈물, 눈 따끔거림, 숨 막히는 느낌 등을 포함함\n·직접적으로 상당히 많은 양의 노출 시 기도를 자극하고 결막의 염증, 삼키는 것이 어려워지고, 인두의 홍반을 추가로 유발함\n·다른 증상은 구토, 메스꺼움, 복통, 열, 두통, 현기증, 떨림, 미동, 경련, 말초신경 염증을 포함할 수 있음 \n·고농도로 급성 흡입 시 기관지의 갑작스런 경련, 폐가 붓는 것에 이은 호흡 곤란, 결막과 혀에 염증을 유발할 수 있음 \n·호흡 마비가 생길 수 있음 \n·이산화황으로 인한 호흡기 손상은 장기간 지속될 수 있고 치료가 불가능할 수 있음 \n·주기적인 노출은 후각을 약하게 만들 수 있음 · skin=·액화된 이산화황과 직접 접촉 시 동상을 유발할 수 있음 \n·이 물질이 직접 피부에 접촉되면 화학적 화상을 일으킬 수 있음\n·피부 접촉은 유해한 건강 영향을 유발시키지 않는 것으로 간주함(동물 모델을 이용한 EC Directives 분류 기준으로서)\n·그러나, 전신적인 유해 영향은 적어도 어느 하나의 다른 인 조치·조언을 구하시오.|오염된 의복을 벗으시오.|뜨거운 물질인 경우, 열을 없애기 위해 영향을 받은 부위를 다량의 차가운 물에 담그거나 씻어내시오|긴급 의료조치를 받으시오|오염된 옷과 신발을 제거하고 오염지역을 격리하시오|물질과 접촉시 즉시 20분 이상 흐르는 물에 피부와 눈을 씻어내시오|경미한 피부 접촉 시 오염부위 확산을 방지하시오\n  흡입했을 때: 노출되거나 노출이 우려되면 의학적인 조치·조언을 구하시오.|과량의 먼지 또는 흄에 노출된 경우 깨끗한 공기로 제거하고 기침이나 다른 증상이 있을 경우 의료 조치를 취하시오.\n  먹었을 때: 노출되거나 노출이 우려되면 의학적인 조치·조언을 구하시오.|물질을 먹거나 흡입하였을 경우 구강대구강법으로 인공호흡을 하지 말고 적절한 호흡의료장비를 이용하시오\n  기타 의사의 주의사항: 폭로시 의료진에게 연락하고 추적조사 등의 특별한 응급조치를 취하시오.|의료인력이 해당물질에 대해 인지하고 보호조치를 취하도록 하시오\n  국내규정: |TWA : 10ppm\n  ACGIH 규정: TWA 10 ppm ㎎/㎥\n  적절한 공학적 관리: |공정격리, 국소배기를 사용하거나, 공기수준을 노출기준 이하로 조절하는 다른 공학적 관리를 하시오.||운전시 먼지, 흄 또는 미스트를 발생하는 경우, 공기 오염이 노출기준 이하로 유지되도록 환기하시오||이 물질을 저장하거나 사용하는 설비는 세안설비와 안전 샤워를 설치하시오.\n  호흡기 보호: |노출농도가 500 ppm보다 낮을 경우 적절한 필터 또는 정화통을 장착한 전면형 또는 전동식 반면형 또는 공기 공급형 연속흐름식/압력요구식 반면형 호흡보호구를 착용하시오|노출농도가 10000 ppm보다 낮을 경우 적절한 필터 또는 정화통을 장착한 전면형 또는 헬멧/후드 타입, 압력요구식 송기마스크를 착용하시오|노출농도가 100000 ppm보다 낮을 경우 적절한 필터 또는 정화통을 장착한 자가공기공급식(SCBA) 또는 압력요구식 자가공기공급식(SCBA) 호흡보호구를 착용하시오|노출되는 기체/액체 물리화학적 특성에 맞는 한국산업안전보건공단의 인증을 필한 호흡용 보호구를 착용하시오|노출농도가 100 ppm보다 낮을 경우 적절한 필터 또는 정화통을 장착한 반면형 호흡보호구를 착용하시오|노출농도가 250 ppm보다 낮을 경우 적절한 필터 또는 정화통을 장착한 비밀착형(loose-fitting) 후드/헬멧형 전동식 호흡보호구 혹은 연속흐름식 방진마스크/방독마스크(방진마스크는 액체 에어로졸인 \n  눈 보호: |눈의 자극을 일으키거나 기타 건강상의 장해를 일으키는 증기 상태의 유기물질로부터 눈을 보호하기 위해서는 보안경 혹은 통기성 고글을 착용하시오||근로자가 접근이 용이한 위치에 긴급세척시설(샤워식) 및 세안설비를 설치하시오\n  손 보호: |화학물질의 물리적 및 화학적 특성을 고려하여 적절한 재질의 보호장갑을 착용하시오\n  성상: 액체 | ※출처 : NITE\n  색상: 밀짚 색 | ※출처 : HSDB\n  냄새: 불쾌한 냄새\n  녹는점/어는점: -66.9~-52 ℃\n  초기 끓는점과 끓는점 범위: 195 ℃\n  인화점: 76 ℃(O.C.)\n  경구: LD50 2155 ㎎/㎏ 실험종 : Rat (랫드 LD50=4100 mg/kg ) |※출처 : NITE, HSDB, ACGIH\n  피부부식성 또는 자극성: 토끼를 이용한 피부부식성/자극성 시험결과 중간정도의 자극과 함께 홍반, 스케일링, 수종, 피부 괴사가 발생함|※출처 : NITE\n  심한 눈손상 또는 자극성: 토끼를 이용한 심한눈손상/자극성 시험결과 중간정도의 자극성과 함께 결막부종이 발생함|※출처 : NITE\n  NTP: R\n  생식세포변이원성: 생체 내 소핵 시험 (MIN), 세포 유전 학적 분석 (CAS)와 자매 염색 분체 교환 시험 결과 양성|※출처 : NITE\n  생식독성: 랫드를 이용한 발달독성/최기형성/모계독성 시험결과 유선 증식을 관찰하고 신생아의 사망률이 증가, 출산률 감소, 생존률 감소등이 발생함 랫드를 이용한 발달독성시험결과 1000 mg/kg bw/day에서 체중감소로 N ·일부 케톤은 여러가지 신경질환을 야기하여, 몸의 저림을 유도하고 사지를 약하게 할 수 있음 \n·아세톤의 흡입은 중추신경계의 기능저하, 약간 어지러움, 산란(성)언어, 운동실조증, 혼미, 저혈압, 빠른 맥박, 대사 산독증, 고혈당 그리고 케톤증을 유발함\n·드물게, 경련과 관의 괴사가 있음\n·노출의 다른 증상은 초조함, 두통, 구토, 저혈압, 빠르고 불규칙적인 맥박, 눈과 목의 자극, 다리의 쇠약, 현기증을 포함할 수 있음\n·고농도로 흡입하면 입과 목의 건조, 조정되지 않은 움직임, 공동 작용할 수 있는 언어능력의 손실, 졸음, 극심한 경우 혼수상태를 줄 수 있음\n·오랫동안 아세톤 증기 흡입은 기도의 자극, 기침, 두통을 유발함\n·농도 5.22 %가 1시간 동안 노출된 랫드는 졸음을 보여줌; 12.66 %에서 사망 · skin=·노출은 홍반, 건조 및 염증으로 특징되는 자극을 유발할 수 있음\n·정상적 취급 및 사용시, 반복 노출은 피부의 건조, 갈라짐, 벗겨짐을 유발시킬 수 있음 \n·이 물질의 피부접촉은 개인의 건강을 손상시킬 수있고, 흡수된 후, 전신에 영향을 초래할 수 있음\n·이 물질은 직접적인 접촉 후 또는 시간이 경과된 후에, 경증이지만 유의한 염증을 유발시킬 수 있다는 것을 제시하는 일부 증거가 있음\n·반복 노출은 홍반, 부어오름, 수포 등의 접촉성 피부염을 유발시킬 수 있음\n·이 물질을 베인 상처, 찰과상 또는 자극을 일으킨 피부에 노출시키지 말 것\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우, 유해한 영향과 함께 전신 손상을 유발할 수 있음\n·물질 사용에 앞서, 피부를 검사하고, 모든 외상으로 부터 적절히 보호할 것 · eyeball=·작열감, 충혈, 눈물분비, 염증 및 각막손상으로 특징지어지는 자극을 일으킴\n·액체는 눈에 불쾌감을 유발시킬 수도 있고, 일시적인 시력 장애 및/또는 다른 일시적인 눈 염증, 궤양을 일으킬 수 있음\n·이 물질은 일부 사람에게 눈 자극을 일으키고, 점안 24시간 이후 눈손상을 일으킬 수 있다는 증거가 있음\n·통증과 함께 심한 염증이 나타날 것으로 예상됨\n·각막을 손상시킬 수 있음\n·응급처치가 바로 이루어지지 않으면 시력을 영원히 잃을 수 있음\n·반복 노출은 결막염을 일으킬 수 있음 · oral=·소화기관에 자극을 일으킬 수 있음\n·중추신경계의 기능 저하, 신장의 손상, 간의 손상을 일으킬 수 있음\n·증상은 포함할수 있음: 두통, 흥분, 피로, 메스꺼움, 구토, 혼미, 혼수상태\n·단계는 쇠약, 무의식, 혼수상태 그리고 호흡부전으로 인한 사망을 유발할 수 있음\n·액체를 삼키면 폐로 흡인이 일어나 심각한 영향을 줄 수 있는 화학적 폐렴을 야기할 수 있음\n·사고로 섭취한 경우는 건강에 손상을 줄 수 있음 · etc=·자료없음\n\n[NIOSH]\n  name=Acetone · cas=67-64-1 · formula=CH3COCH3 · rel=250 ppm (590 mg/m³) · pel=1000 ppm (2400 mg/m³) · idlh=2500 ppm [10% LEL] · ppe_respiratory=OV/SA · ppe_eye=Safety glasses with side shields · ppe_gloves=Butyl · target_organs=Eyes, skin, respiratory system, CNS · symptoms=Irritation eyes, nose, throat; headache, dizziness; dermatitis\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 인화성 액체 : 구분2|심한 눈 손상성/눈 자극성 : 구분2|생식독성 : 구분2|특정표적장기 독성(1회 노출) : 구분3(마취영향)|특정표적장기 독성(반복 노출) : 구분1\n  그림문자: GHS02.gif|GHS07.gif|GHS08.gif\n  신호어: 위험\n  유해·위험문구: H225 : 고인화성 액체 및 증기|H319 : 눈에 심한 자극을 일으킴|H336 : 졸음 또는 현기증을 일으킬 수 있음|H361 : 태아 또는 생식능력 의 혼수는 노출을 유발함\n·불활성기체의 노출은 직접적으로 내부 가스의 압력과 관련됨\n·이러한 혼수로 가장 잘 알려진 형태는 질소에 의하여 생성되는 것이고 다양하게 압축된 공기호흡이 공통적임\n·헬륨과 네온을 가능한 제외하고 비활성기체 계열의 불활성기체는 혼수와 무감각을 또한 유발함\n·시도는 왜 불활성기체가 훨씬 더 다른 것 들보다 강하다는 것을 성명하게 만들어줌\n·모든 경우에서, 혼수가 이루어진 정도는 기체혼합물 호흡에 불활성기체의 부분압력이 비례함\n·불활성기체의 액체 용해도와 마약의 영향 사이에서 관계가 얻어짐\n·약물의 마취제의 효능은 그것의 입자가 가능한 세포막에서 액체 면의 물리적면적으로 변경되는 것과 또한 관련이 있음\n·다른 말로 마취제는 세포벽의 확장이 마취제 약물의 분자 흡수에 의해 어떠한 치명적인 부피 이상으로 팽창이 될때, 발생함  \n·제논의 능력이 발생한 혼수는 불활성 기체 수소의 형태에 의하여 혹은 식경종말에 방해를 생성하는 포접화물이 방생할 수 있음\n·질식의 증상은 두통, 현기증, 호흡곤란, 근육약화, 졸음 및 귀의 이명을 포함할 수 있음\n·질식이 지속되면, 메스꺼움 및 구토, 또 다른 신체적 쇠약 및 의식불명이 유발될 수 있고, 결국 경련, 혼수상태 및 사망에 이를 수 있음\n·비독성 가스의 상당한 농도는 공기중 산소 수치를 감소시킴\n·산소량이 21-14 %로 감소하면, 맥박 수는 빨라지고 호흡률과 호흡량이 증가함\n·주의력 및 사고력을 유지하는 능력은 명백히 감소되며, 근육공조는 다소 방해받음\n·산소량이 14-10 %까지 감소하면, 분별력이 안좋아짐; 고통없이 심각한 손상을 유발할 수 있음\n·근육운동은 급격한 피로를 유발함\n·6 %까지 감소하면 메스꺼움, 구토를 유발할 수 있고 운동성을 상실할 수 있음\n·산소 농도가 낮은 경우에 노출되었을 때, 심지어 소생 후에도 영구적인 뇌손상을 유발할 수 있음\n·6 % 이하에서 호흡이 가빠지고 경련이 발생할 수 있음\n·산소를 함유하지 않은 혼합물의 흡입은 첫 호흡에서 의식불명을 유발할 수 있고 몇분 이내 사망할 수 있음 · skin=·이 물질은 접촉을 통해 피부 자극이나 건강 손상을 일으킨다고 여겨지지 않음(동물 임상실험을 통한 EC 지침서에 분류된 바에 의하면)\n·그럼에도 불구하고, 양호한 작업 위생 실천을 위해서, 작업환경에서 노출을 최소화시키고 적절한 보호 장갑을 착용하도록 요구됨\n·이 물질을 베인 상처, 찰과상 또는 자극을 일으킨 피부에 노출시키지 말 것\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우, 유해한 영향과 함께 전신 손상을 유발할 수 있음\n·물질 사용에 앞서, 피부를 검사하고, 모든 외상으로부터 적절히 보호할 것 · eyeball=·이 물질은 자극제로 고려되지는 않지만 (EC 지침에 의해 분류된 바에 의하면), 직접적 눈 접촉은 눈물이나 결막충혈(바람에 의한 피부염처럼)과 같은 일시적 불쾌감을 일으킬 수 있음\n·극도로 휘발성 가스이기 때문에 위험으로 고려되어 지지 않음 · oral=·노출경로 일 것 같지 않음\n·물질은 방에서의 온도와 대기압의 기체이고 필수적인 무독성임\n·제품의 물리적 형태 때문에 일반적으로는 유해하지 않음\n·상업/사업장 환경에서 섭취경로가 예상되지 않음 · etc=·자료없음\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 인화성 가스 : 구분1|고압가스 : 압축가스\n  그림문자: GHS02.gif|GHS03.gif\n  신호어: 위험\n  유해·위험문구: H220 : 극인화성 가스|H280 : 고압가스:가열하면 폭발할 수 있음\n  예방: P210 : 열,고온의 표면,스파크,화염 및 그 밖의 점화원으로부터 멀리하시오.금연\n  대응: P377 : 가스 누출 화재;누출을 안전하게 막을 수 없다면,불을 끄려하지 마시오.|P381 : 누출 시 모든 점화원을 제거하시오.\n  눈에 들어갔을 때: 긴급 의료조치를 받으시오\n  피부에 접촉했을 때: 긴급 의료조치를 받으시오|피부에 얼어붙은 옷은 제거하기전 해동하시오|화상의 경우 즉시 찬물로 가능한 오래 해당부위를 오.|P332+P313 : 피부 자극이 나타나면:의학적인 조치/조언을 받으시오.|P337+P313 : 눈에 자극이 지속되면:의학적인 조치/조언을 받으시오.|P362+P364 : 오염된 의류를 벗고 다시 사용 전 세척하시오.|P391 : 누출물을 모으시오\n  눈에 들어갔을 때: 눈에 묻으면:몇 분간 물로 조심해서 씻으시오.가능하면 콘택트렌즈를 제거하시오.계속 씻으시오.|눈에 자극이 지속되면:의학적인 조치/조언을 받으시오.\n  피부에 접촉했을 때: 피부 자극이 나타나면:의학적인 조치/조언을 받으시오.|오염된 의류를 벗으시오.|뜨거운 물질인 경우, 열을 없애기 위해 영향을 받은 부위를 다량의 차가운 물에 담그거나 씻어내시오|오염된 옷과 신발을 제거하고 오염지역을 격리하시오|물질과 접촉시 즉시 20분 이상 흐르는 물에 피부와 눈을 씻어내시오\n  흡입했을 때: 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|과량의 먼지 또는 흄에 노출된 경우 깨끗한 공기로 제거하고 기침이나 다른 증상이 있을 경우 의료 조치를 취하시오.|호흡하지 않는 경우 인공호흡을 실시하시오|호흡이 힘들 경우 산소를 공급하시오\n  먹었을 때: 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|입을 씻어내시오.\n  기타 의사의 주의사항: 폭로시 의료진에게 연락하고 추적조사 등의 특별한 응급조치를 취하시오.|의료인력이 해당물질에 대해 인지하고 보호조치를 취하도록 하시오\n  국내규정: |자료없음\n  적절한 공학적 관리: |공정격리, 국소배기를 사용하거나, 공기수준을 노출기준 이하로 조절하는 다른 공학적 관리를 하시오.||운전시 먼지, 흄 또는 미스트를 발생하는 경우, 공기 오염이 노출기준 이하로 유지되도록 환기하시오||이 물질을 저장하거나 사용하는 설비는 세안설비와 안전 샤워를 설치하시오.\n  호흡기 보호: |노출되는 입자상 물질의 물리화학적 특성에 맞는 산업안전보건공단의 인증을 필한 호흡용 보호구를 착용하시오|입자상 물질의 경우 다음과 같은 호흡기 보호구가 권고됨 - 안면부 여과식 방진마스크 또는 공기 여과식 방진마스크(고효율 미립자 여과재) 또는 전동팬 부착방진 마스크(분진, 미스트, 흄용 여과재)|산소가 부족한 경우(&amp;lt;19.6%), 송기마스크, 혹은 자급식 호흡보호구를 착용하시오\n  눈 보호: |눈에 자극을 일으키거나 기타 건강상의 장해를 일으킬 수 있는 입자상 물질에 대하여 눈을 보호하기 위하여 통기성 보안경을 착용하시오||근로자가 접근이 용이한 위치에 긴급세척시설(샤워식) 및 세안설비를 설치하시오\n  손 보호: |화학물질의 물리적 및 화학적 특성을 고려하여 적절한 재질의 보호장갑을 착용하시오\n  신체 보호: |화학물질의 물리적 및 화학적 특성을 고려하여 적절한 재질의 보호의복을 착용하시오\n  성상: 고체(크리스탈) | ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  색상: 노란색에서 주황색까지 | ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  녹는점/어는점: 68 ℃| ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  초기 끓는점과 끓는점 범위: 293 ℃| ※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  인화점: 123 ℃| ※출처 : The Chemical Database, The Department of Chemistry at the University of Akron(http://ull.chemistry.uakron.edu/erd)\n  인화 또는 폭발 범위의 상한/하한: - / -\n  경구: LD50 1000 ㎎/㎏ 실험종 : Rat (노동부 구분 4) |※출처 : Corporate Solution From Thomson Micromedex(http://csi.micromedex.com)\n  흡입: 구분4|※출처 : ECHA Harmonised C&amp;L\n  피부부식성 또는 자극성: 사람에서 피부 자극성 있음.|※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  심한 눈손상 또는 자극성: 사람에서 눈 자극성 있음.|※출처 : National Library of Medicine/Hazardous Substances Data Bank(NLM/HSDB)(http://toxnet.nlm.nih.gov/cgi-bin/sis/htmlgen?HSDB)\n  IARC: 3\n  EU CLP: 1B\n  산업안전보건법에 의한 규제: 해당없음\n  화학물질관리법에 의한 규제: 해당없음\n  화학물질의 등록 및 평가 등에 관한 법률 규제: 해당없음\n  위험물안전관리법에 의한 규제: 해당없음\n  폐기물관리법에 의한 규제: 해당없음\n  국내규제: 해당없음\n\n[PubChem]\n  cid: 2272\n  signal_word: "}, {"id": "L0baac11d", "chem": "Dodecylbenzene (123-01-3)", "q": "그림문자 GHS05 (부식성)", "ev": "[K-REACH 등록]\n  name_en=Dodecylbenzene · ke_no=KE-12944\n\n[ECHA]\n  source=ECHA · data={'rml_id': '100.004.175', 'name': 'Dodecylbenzene', 'ec_number': '204-591-8', 'molecular_formula': 'C18H30', 'regulatory_processes': [], 'clp_classifications': []}\n\n[KISChem 독성/응급]\n  chem_ko=·도데실벤젠 · symptom=·액체는 눈에 가벼운 자극을 일으키고, 피부와의 반복된 접촉은 알레르기 반응을 일으킬 수 있음\n·섭취는 구역질을 일으킴 · inhale=·호흡기도 자극성을 유발할 수 있음\n·보고된 자료에 의하면 이 물질은 사람에 따라 호흡기 자극성의 원인이 될 수 있음\n·심각한 중독은 호흡기도 기능 저하를 유발하고 치명적일 수 있음\n·증기상 물질 흡입의 증상은 수면, 긴장 완화, 반사작용의 둔화, 근육 운동의 축소, 현기증이 수반될 수 있음\n·일반적인 취급 과정에서 발생하는 증기상 물질과 에어로졸(미스트, 흄)을 흡입할 경우 개인의 건강에 손상을 가져올 수 있음\n·고농도의 기체/증기를 흡입하면 기침과 메스꺼움을 동반한 폐의 자극, 두통과 현기증, 반사작용 저하, 피로, 운동실조증를 동반한 중추신경장애를 일으킬 수 있음\n·자극에 대한 신체 반응은 폐 손상의 원인이 될 수 있음\n·일반적인 불쾌감, 두통, 마취효과, 반응속도의 감소, 어눌한 말투를 포함한 중추신경계 기능저하는 무의식 상태를 유발할 수 있음\n·알킬벤젠의 급성 흡입 독성은 중추신경계 기능저하로 가장 잘 설명됨\n·심장혈관 허탈으로 인한 심장마비가 올 수 있음\n·서맥, 저혈압 또한 올 수 있음\n·알킬벤젠에 급성흡입노출되는 것은 전신마취와 유사할 것임\n·알킬벤젠은 높은 수준으로 노출 되었을때 일반적으로 다른 것들보다 치명적이지 않음\n·이것은 알킬벤젠의 대사산물이 낮은 순서의 독성을 가지고 쉽게 배출되기 때문임\n·대체 경로가 넘쳐남에 따라서 신진대사 경로가 포화될 수 있다는 증거는 거의 없음\n·동물이 보통 대기와 비슷한 수준의 알킬벤젠증기를 흡입하였을경우 사망함(일반적으로 lc50s은 5,000 -8,000 ppm으로 4-8시간 노출) \n·추후의 독성을 생성할 수 있는 독성 반응을 중개한다는 증거와 돌연변이 유발 효과 모두 증거가 없음\n·흡입 유해성은 고온에서 더 증가됨\n·이 물질의 독성학적 특성에 대해서는 완벽하게 조사되지 않았음 · skin=·피부 자극을 유발할 수 있음\n·이 물질은 일부사람에게 있어, 피부 접촉 즉시 피부염을 유발시킬 수 있음\n·이 물질은 기존 피부염의 증상을 악화시킬 수 있음\n·피부 접촉은 유해한 건강 영향을 유발시키지 않는 것으로 간주함(동물 모델을 이용한 EC Directives 분류 기준으로서); 이 물질은 상처, 외상, 찰과상을 입은 부분을 통해 침투되면 건강 손상을 유발시킬 수 있음\n·이 물질을 베인 상처, 찰과상 또는 자극을 일으킨 피부에 노출시키지 말 것\n·베임, 찰과상 또는 환부를 통하여 혈액 속에 들어갈 경우, 유해한 영향과 함께 전신 손상을 유발할 수 있음\n·물질 사용에 앞서, 피부를 검사하고, 모든 외상으로 부터 적절히 보호할 것\n·이 물질의 독성학적 특성에 대해서는 완벽하게 조사되지 않았음 · eyeball=·이 물질은 사람에 따라 눈에 자극과 손상을 일으킬 수 있다고 보고된 바 있음\n·비이온성 계면활성제는 일반적으로 다른 물질에 의한 불쾌감을 느끼지 못하도록 각막 마비를 일으킬 수 있으며, 각막 손상을 일으킬 수 있음\n·계면활성제와의 접촉기간, 특징 및 농도에 따라 자극이 다양하게 나타남 · oral=·섭취할 경우 소화관 자극을 일으킬 수 있음\n·독성학적 성질에 대해서는 충분히 연구되지 않았음\n·액체를 삼키면 폐로 흡인이 일어나 심각한 영향을 줄 수 있는 화학적 폐렴을 일으킬 수 있음(ICSC 13733)\n·사고로 섭취한 경우는 건강에 손상을 줄 수 있음\n·비이온 계면활성제류는 구강 및 위장에 국부적 자극을 일으킬 수 있으며 구토와 경미한 설사를 유발함 · etc=·자료없음\n\n[KOSHA MSDS]\n  유해성·위험성 분류: 급성 독성(경피) : 구분4|급성 독성(흡입: 증기) : 구분2|피부 부식성/피부 자극성 : 구분2|피부 과민성 : 구분1(1A/1B)|생식독성 : 구분2\n  그림문자: GHS06.gif|GHS08.gif\n  신호어: 위험\n  유해·위험문구: H312 : 피부와 접촉하면 유해함|H315 : 피부에 자극을 일으킴|H317 : 알레르기성 피부 반응을 일으킬 수 있음|H330 : 흡입하면 치명적임|H361 : 태아 또는 생식능력에 손상을 일으킬 것으로 의심됨(알려진 특정한 영향을 명시한다.)(생식독성을 일으키는 노출 경로를 기재한다. 단, 다른 노출경로에 의해 생식독성을 일으키지 않는다는 결정적인 증거가 있는 경우에 한한다.)\n  예방: P201 : 사용 전 취급 설명서를 확보하시오.|P202 : 모든 안전 예방조치 문구를 읽고 이해하기 전에는 취급하지 마시오.|P260 : 분진/흄/가스/미스트/증기/스프레이를(을)흡입하지 마시오.|P261 : 분진/흄/가스/미스트/증기/스프레이의 흡입을 피하시오.|P264 : 취급 후에는…을(를)철저히 씻으시오.|P271 : 옥외 또는 환기가 잘 되는 곳에서만 취급하시오.|P272 : 작업장 밖으로 오염된 의류를 반출하지 마시오.|P280 : 보호장갑/보호의/보안경/안면보호구를(을)착용하시오.|P284 : [환기가 잘 되지 않는 경우]호흡기 보호구를 착용하시오.\n  대응: P302+P352 : 피부에 묻으면:다량의 물/…(으)로 씻으시오.|P304+P340 : 흡입하면:신선한 공기가 있는 곳으로 옮기고 호흡하기 쉬운 자세로 안정을 취하시오.|P308+P313 : 노출되거나 노출이 우려되면:의학적인 조치/조언을 받으시오.|P310 : 즉시 의료기관/의사/…의 진찰을 받으시오.|P312 : 불편함을 느끼면 의료기관/의사/…의 진찰을 받으시오.|P320 : 긴급히…처치를 하시오.|P321 : …처치를 하시오.|P332+P313 : 피부 자극이 나타나면:의학적인 조치/조언을 받으시오.|P333+P313 : 피부 자극 또는 홍반이 나타나면:의학적인 조치/조언을 받으시오.|P362+P364 : 오염된 의류를 벗고 다시 사용 전 세척하시오.\n  눈에 들어갔을 때: 긴급 의료조치를 받으시오|물질과 접촉시 즉시 20분 이상 흐르는 물에 피부와 눈을 씻어내시오\n  피부에 접촉했을 때: 뜨거운 물질인 경우, 열을 없애기 위해 영향을 받은 부위를 다량의 차가운 물에 담그거나 씻어내시오|긴급 의료조치를 받으시오|오염된 옷과 신발을 제거하고 오염지역을 격리하시오|물질과 접촉시 즉시 20분 이상 흐르는 물에 피부와 눈을 씻어내시오|경미한 피부 접촉 시 오염부위 확산을 방지하시오|피부자극성 또는 홍반이 나타나면 의학적인 조치·조언을 구하시오.|오염된 의복은 벗고 다시 사용 전 세탁하시오.\n  흡입했을 때: 과량의 먼지 또는 흄에 노출된 경우 깨끗한 공기로 제거하고 기침이나 다른 증상이 있을 경우 의료 조치를 취하시오.|즉시 의료기관(의사)의 진찰을 받으시오.\n  먹었을 때: 물질을 먹거나 흡입하였을 경우 구강대구강법으로 인공호흡을 하지 말고 적절한 호흡의료장비를 이용하시오|노출되거나 노출이 우려되면 의학적인 조치·조언을 구하시오.\n  기타 의사의 주의사항: 폭로시 의료진에게 연락하고 추적조사 등의 특별한 응급조치를 취하시오.|의료인력이 해당물질에 대해 인지하고 보호조치를 취하도록 하시오\n  국내규정: |자료없음\n  ACGIH 규정: 해당 없음\n  생물학적 노출기준: |해당 없음\n  적절한 공학적 관리: |공정격리, 국소배기를 사용하거나, 공기수준을 노출기준 이하로 조절하는 다른 공학적 관리를 하시오.||운전시 먼지, 흄 또는 미스트를 발생하는 경우, 공기 오염이 노출기준 이하로 유지되도록 환기하시오||이 물질을 저장하거나 사용하는 설비는 세안설비와 안전 샤워를 설치하시오.\n  호흡기 보호: |노출되는 기체/액체의 물리화학적 특성에 맞는 산업안전보건공단의 인증을 필한 호흡용 보호구를 착용하시오|기체/액체 물질의 경우 다음과 같은 호흡기 보호구가 권고됨 -격리식 전면형 방독마스크(유기화합물용(산성가스인 경우 산성가스용)) 또는 격리식 반면형 방독마스크(유기화합물용(산성가스인 경우 산성가스용)) 또는 직결식 전면형 방독 마스크(유기화합물용(산성가스인 경우 산성가스용)) 또는 반면형 방독 마스크(유기화합물용(산성가스인 경우 산성가스용)) 또는 전동식 방독마스크|산소가 부족한 경우(&amp;lt;19.5%), 송기마스크 혹은 자급식공기호흡기를 착용하시오\n  눈 보호: |눈의 자극을 일으키거나 기타 건강상의 장해를 일으키는 증기상태의 유기물질로부터 눈을 보호하기 위해서는 보안경 혹은 통기성 보안경을 착용하시오||근로자가 접근이 용이한 위치에 긴급세척시설(샤워식) 및 세안설비를 설치하시오\n  성상: 액체\n  냄새: 없음\n  냄새역치: (취기 한계: 없음)\n  pH: (자료없음)\n  녹는점/어는점: 3 ℃\n  초기 끓는점과 끓는점 범위: 331 ℃\n  가능성이 높은 노출 경로에 관한 정보: 후두염, 구역, 구토, 두통 구역, 위통, 두통, 폐 울혈 자극\n  경구: LD50 &gt;5000 ㎎/㎏ 실험종 : Rat|※출처 : SIDS\n  경피: LD50 2000 ㎎/㎏ 실험종 : Rabbit|※출처 : SIDS\n  흡입: 증기 LC50 &gt;1.82 ㎎/ℓ 실험종 : Rat|※출처 : SIDS\n  피부부식성 또는 자극성: 토끼 - 자극(24hr)|※출처 : SIDS\n  심한 눈손상 또는 자극성: 토끼 - 경자극|※출처 : SIDS\n  산업안전보건법에 의한 규제: 해당없음\n  화학물질관리법에 의한 규제: 해당없음\n  화학물질의 등록 및 평가 등에 관한 법률 규제: 기존화학물질\n  위험물안전관리법에 의한 규제: 4류 제3석유류(비수용성액체) (2000ℓ)\n  폐기물관리법에 의한 규제: 지정폐기물\n  국내규제: 해당없음\n\n[PubChem]\n  cid: 31237\n  signal_word: Warning\n  H315 (17.7%): Causes skin irritation [Warning Sk function pick(v){L[D[i].id]=v;save();render();setTimeout(function(){if(i<D.length-1){i++;render()}},130)}
function go(d){i=Math.max(0,Math.min(D.length-1,i+d));render()}
function jumpNext(){for(var k=1;k<=D.length;k++){var j=(i+k)%D.length;if(!L[D[j].id]){i=j;render();return}}}
function exp(){let r=[['id','chem','statement','human_label']];
 D.forEach(function(it){r.push([it.id,it.chem,it.q,L[it.id]||''])});
 let csv=r.map(function(x){return x.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
 let bl=new Blob(['\ufeff'+csv],{type:'text/csv'}),a=document.createElement('a');
 a.href=URL.createObjectURL(bl);a.download='chsb-human-labels.csv';a.click()}
render();
